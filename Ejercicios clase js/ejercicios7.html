
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 7</title>
</head>
<body>
    <h1>Ejercicio 7: Getters y setters</h1>
    <div id="resultado"></div>

    <script>
        class Producto {
            constructor(nombre, precio) {
                this.nombre = nombre;
                this.precio = precio;
            }

            get obtenerPrecio() {
                return this.precio;
            }

            set cambiarPrecio(nuevoPrecio) {
                this.precio = nuevoPrecio;
            }
        }

        let producto1 = new Producto("Teclado", 25);
        let texto = "Producto: " + producto1.nombre + "<br>";
        texto += "Precio inicial: " + producto1.obtenerPrecio + " €<br>";

        producto1.cambiarPrecio = 30;

        texto += "Precio nuevo: " + producto1.obtenerPrecio + " €";

        document.getElementById("resultado").innerHTML = texto;
    </script>
</body>
</html>
