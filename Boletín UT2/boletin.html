  let repetir1 = true;

//Ejercicio 17
let repetir5 = true;

while (repetir5) {

    function leerFecha(mensaje) {

        let dia, mes, año;
        let fechaValida = false;

        while (!fechaValida) {

            dia = Number(prompt(mensaje + "\nIntroduce el día:"));
            mes = Number(prompt("Introduce el mes:"));
            año = Number(prompt("Introduce el año:"));

            if (!Number.isInteger(dia) || !Number.isInteger(mes) || !Number.isInteger(año)) {
                alert("Introduce números enteros.");
                continue;
            }

            let bisiesto = (año % 4 === 0 && año % 100 !== 0) || año % 400 === 0;

            let diasMes = [
                31, bisiesto ? 29 : 28, 31, 30, 31, 30,
                31, 31, 30, 31, 30, 31
            ];

            if (año > 0 && mes >= 1 && mes <= 12 &&
                dia >= 1 && dia <= diasMes[mes - 1]) {

                fechaValida = true;

            } else {
                alert("Fecha incorrecta. Inténtalo de nuevo.");
            }
        }

        return { dia, mes, año };
    }

    let fecha1 = leerFecha("PRIMERA FECHA");
    let fecha2 = leerFecha("SEGUNDA FECHA");

    if (fecha1.año < fecha2.año) {

        console.log("La primera fecha es anterior.");

    } else if (fecha1.año > fecha2.año) {

        console.log("La segunda fecha es anterior.");

    } else if (fecha1.mes < fecha2.mes) {

        console.log("La primera fecha es anterior.");

    } else if (fecha1.mes > fecha2.mes) {

        console.log("La segunda fecha es anterior.");

    } else if (fecha1.dia < fecha2.dia) {

        console.log("La primera fecha es anterior.");

    } else if (fecha1.dia > fecha2.dia) {

        console.log("La segunda fecha es anterior.");

    } else {

        console.log("Las dos fechas son iguales.");
    }

    repetir5 = confirm("¿Quieres volver a ejecutar el programa?");
}
